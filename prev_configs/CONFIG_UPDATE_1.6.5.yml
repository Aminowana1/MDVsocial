# MDVSocial 1.6.5 - navegación Bedrock
# Estas claves son opcionales; si no las copias, el plugin usa estos valores por defecto.
bedrock:
  form-navigation:
    delay-ticks: 1
    debug: false

  mobile-safety:
    enabled: true
    dynamic-page-size: 5

