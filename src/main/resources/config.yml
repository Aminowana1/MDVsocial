# ==========================================================
# Nombre interactivo en el chat
#
# Conserva el renderer existente de Paper/LPC y añade la interacción
# únicamente sobre el nombre del jugador.
#
# Clic normal: abre Menus/jugador_opciones.yml
# Shift + clic: inserta /msg <jugador> en la barra del chat.
# ==========================================================
# ==========================================================
# COMPATIBILIDAD BEDROCK - Geyser + Floodgate
# ==========================================================
bedrock:
  # Detecta automáticamente jugadores Floodgate.
  enabled: true

  # Los jugadores Bedrock usan Forms nativos cargados desde:
  # plugins/MDVSocial/MenusBedrock/

  # Si falta un archivo en MenusBedrock, permite abrir temporalmente
  # el inventario Java equivalente para no dejar al jugador bloqueado.
  fallback-to-java-menu: true

  # Cantidad de entradas por página en listas dinámicas para PC/consola.
  dynamic-page-size: 8

  # Navegación entre Forms. Desde 1.6.5 TODOS los dispositivos usan la misma
  # transición. No se aplica debounce global ni delays distintos por input,
  # porque podían consumir el primer toque válido del siguiente Form en móvil.
  form-navigation:
    delay-ticks: 1
    debug: false

  # Solo ajusta el tamaño de listas en dispositivos táctiles. No controla ya
  # la navegación ni el tiempo de respuesta entre formularios.
  mobile-safety:
    enabled: true
    dynamic-page-size: 5

  # Marca de pendientes en el menú "Social y Amigos" ({friend_requests_badge},
  # {party_invites_badge}, {unread_mail_badge}). Con 0 pendientes no se muestra nada.
  badges:
    format: ' ({count})'

  # Selector "Escoger jugador" (Invitar al grupo, Añadir amigo).
  player-picker:
    # Jugadores conectados por página. Textos en MenusBedrock/escoger_jugador.yml.
    page-size: 6

  party:
    # El formulario de "Invitar jugador" usa el comando oficial de MMOCore.
    # Así el jugador Java recibe una PartyInvite normal y /party accept|deny funciona.
    direct-invite-command: 'party invite {target}'

# ==========================================================
# Solicitudes de MMOCore (invitaciones a grupo y solicitudes de amistad)
# Detecta cualquier solicitud (menús de MDVSocial, GUI de MMOCore, otros plugins).
# Las de jugadores que bloqueaste se retiran en silencio.
# ==========================================================
mmocore-requests:
  # Cada cuánto se revisan solicitudes nuevas (20 ticks = 1 s). Las de MDVSocial
  # se avisan al instante; esto cubre las que vienen de fuera.
  check-interval-ticks: 20

# ==========================================================
# Avisos de invitación a Grupo de Aventura
# Reemplazan el mensaje "party-invite" de MMOCore, que debe estar silenciado en su messages.yml.
# ==========================================================
party-invites:
  enabled: true
  # Abrir el menú del grupo al unirte a uno (el de MMOCore en Java, el formulario en Bedrock).
  open-menu-on-join: false

  # Jugadores Java. Cada línea es JSON de chat (o texto normal); se aceptan códigos &.
  # Tokens: {player} = quien invita, {uuid} = id de la invitación (lo usa /mmocore:party accept|deny).
  java:
    enabled: true
    format:
      - '{"text":""}'
      - '{"text":"&6&l[&5&lMDVCRAFT&6&l]  &4»&r &6{player} &ete ha invitado a su grupo."}'
      - '[{"text":"        "},{"text":"&8[&a&lACEPTAR&8]","clickEvent":{"action":"run_command","value":"/mmocore:party accept {uuid}"},"hoverEvent":{"action":"show_text","value":"&eClick para aceptar."}},{"text":"&r             "},{"text":"&8[&c&lRECHAZAR&8]","clickEvent":{"action":"run_command","value":"/mmocore:party deny {uuid}"},"hoverEvent":{"action":"show_text","value":"&eClick para rechazar."}}]'
      - '{"text":""}'

  # Jugadores Bedrock (sin clicks en el chat). Tokens: {player}, {sneaks}, {seconds}.
  bedrock:
    enabled: true
    # Se usa cuando quick accept está activo para invitaciones (quick-accept.types.party-invite).
    message:
      - ''
      - '&6&l[&5&lMDVCRAFT&6&l]  &4»&r &6{player} &ete ha invitado a su grupo.'
      - '&7Revísala en &fSocial y Amigos &8» &fGrupo de Aventura &8» &fInvitaciones'
      - '&7o &eagáchate {sneaks} veces rápido &7en los próximos &e{seconds}s &7para responder.'
      - ''
    # Se usa cuando quick accept está desactivado.
    message-without-quick-accept:
      - ''
      - '&6&l[&5&lMDVCRAFT&6&l]  &4»&r &6{player} &ete ha invitado a su grupo.'
      - '&7Revísala en &fSocial y Amigos &8» &fGrupo de Aventura &8» &fInvitaciones'
      - ''
    # Si quien invita es tu amigo, el quick accept acepta directamente sin pedir confirmación.
    skip-confirmation-for-friends: true

# ==========================================================
# Solicitudes de amistad
# Reemplazan el mensaje "friend-request" de MMOCore, que debe estar silenciado en su messages.yml.
# - Si el destinatario te bloqueó, no le llega (aviso genérico friend-request-not-delivered).
# - Si tú lo bloqueaste, no se envía: friend-request-target-blocked te pide desbloquearlo.
# - Bloquear a un amigo termina la amistad y retira las solicitudes pendientes entre ambos.
# - Una solicitud repetida no se duplica; si el otro ya te había enviado una, se aceptan y quedan como amigos.
# ==========================================================
friend-requests:
  enabled: true
  # Espera entre solicitudes enviadas desde MDVSocial (0 = sin espera).
  # Permiso para saltarla: mdvsocial.friends.cooldown.bypass
  send-cooldown-seconds: 10

  # Jugadores Java. Tokens: {player} = quien la envía, {uuid} = id de la solicitud
  # (lo usa /mmocore:friends accept|deny).
  java:
    enabled: true
    format:
      - '{"text":""}'
      - '{"text":"&6&l[&5&lMDVCRAFT&6&l]  &4»&r &6{player} &ete ha enviado una solicitud de amistad."}'
      - '[{"text":"        "},{"text":"&8[&a&lACEPTAR&8]","clickEvent":{"action":"run_command","value":"/mmocore:friends accept {uuid}"},"hoverEvent":{"action":"show_text","value":"&eClick para aceptar."}},{"text":"&r             "},{"text":"&8[&c&lRECHAZAR&8]","clickEvent":{"action":"run_command","value":"/mmocore:friends deny {uuid}"},"hoverEvent":{"action":"show_text","value":"&eClick para rechazar."}}]'
      - '{"text":""}'

  # Jugadores Bedrock (sin clicks en el chat). Tokens: {player}, {sneaks}, {seconds}.
  bedrock:
    enabled: true
    # Se usa cuando quick accept está activo para amistad (quick-accept.types.friend-request).
    message:
      - ''
      - '&6&l[&5&lMDVCRAFT&6&l]  &4»&r &6{player} &ete ha enviado una solicitud de amistad.'
      - '&7Revísala en &fSocial y Amigos &8» &fAmigos y Solicitudes'
      - '&7o &eagáchate {sneaks} veces rápido &7en los próximos &e{seconds}s &7para responder.'
      - ''
    # Se usa cuando quick accept está desactivado.
    message-without-quick-accept:
      - ''
      - '&6&l[&5&lMDVCRAFT&6&l]  &4»&r &6{player} &ete ha enviado una solicitud de amistad.'
      - '&7Revísala en &fSocial y Amigos &8» &fAmigos y Solicitudes'
      - ''
    # true: el quick accept acepta directamente. false: abre "Solicitud de X" para confirmar.
    skip-confirmation: false

# ==========================================================
# Quick accept: agacharse varias veces rápido para responder una solicitud.
# Sistema genérico: cada tipo puede sobrescribir cualquier valor en types.<tipo>.
# ==========================================================
quick-accept:
  enabled: true
  # Solo para jugadores Bedrock (Java ya tiene botones clicables en el chat).
  bedrock-only: true
  # Agachadas necesarias.
  sneaks-required: 2
  # Segundos que dura la oportunidad desde que llega la solicitud.
  window-seconds: 30
  # Tiempo máximo (ms) entre levantarse y volver a agacharse. Si se supera, se empieza de cero.
  # También cuentan las agachadas que otro plugin cancela y las que el servidor no llegó a ver.
  max-sneak-gap-millis: 700
  # Sonido de ui-core.sounds al completar el gesto (vacío = ninguno).
  trigger-sound: 'confirm'
  messages:
    # Al terminar el tiempo sin responder (vacío = no avisar).
    expired: ''
  types:
    party-invite:
      enabled: true
      # Ejemplo de ajuste solo para invitaciones:
      # sneaks-required: 3
      # window-seconds: 20
    friend-request:
      enabled: true
    tpa:
      enabled: true
      # sneaks-required: 3

# ==========================================================
# TPA: solicitudes para viajar hasta otro jugador.
# Comandos: /tpa <jugador|aceptar|rechazar|cancelar|ayuda>, /tpaccept, /tpdeny,
# /aceptartp, /rechazartp, /tpacancel. Permiso: mdvsocial.tpa.
# Si el destinatario te bloqueó, la solicitud no llega (aviso genérico).
# Antes estaba en MDVTools; al arrancar se importa sola si aquí no existe la sección.
# ==========================================================
tpa:
  enabled: true
  # Prefijo de los mensajes de TPA.
  prefix: "&6&l[&5&lMDVCRAFT&6&l]  &4»  &r"
  request-timeout-seconds: 60
  cooldown-seconds: 15

  # Espera total después de aceptar antes de teletransportar al solicitante (0 = al instante).
  teleport-delay-seconds: 4

  # Durante este margen inicial el jugador todavía puede moverse.
  # Con 4 segundos totales y 1 de gracia, quedan 3 segundos inmóvil.
  movement-grace-seconds: 1

  cancel-delay-on-move: true
  cancel-delay-on-damage: true
  cancel-delay-on-attack: true

  invulnerability-after-teleport-seconds: 5
  invulnerability-cancel-on-attack: true
  allow-cross-world: true

  # Si quien pide es de tu Grupo de Aventura, la solicitud se acepta sola y se avisa a los dos
  # (mensajes party-auto-accepted y party-auto-accepted-target).
  party-auto-accept:
    # true = tratarlas como cualquier otra solicitud.
    ignore: false

  # Aviso a quien recibe la solicitud.
  # Tokens: {player} = quien la envía, {uuid} = su UUID, {seconds} = segundos para responder.
  notice:
    # Java: cada línea es JSON de chat (o texto normal); se aceptan códigos &.
    java:
      enabled: true
      format:
        - '{"text":"&6&l[&5&lMDVCRAFT&6&l]  &4»  &r&6{player} &equiere teletransportarse hacia ti. &7Expira en &f{seconds} segundos&7."}'
        - '[{"text":"        "},{"text":"&a&l[ACEPTAR]","clickEvent":{"action":"run_command","value":"/tpa aceptarsolicitud {uuid}"},"hoverEvent":{"action":"show_text","value":"&aAceptar esta solicitud de {player}"}},{"text":"       "},{"text":"&c&l[RECHAZAR]","clickEvent":{"action":"run_command","value":"/tpa rechazarsolicitud {uuid}"},"hoverEvent":{"action":"show_text","value":"&cRechazar esta solicitud de {player}"}}]'
    # Bedrock (sin clicks en el chat). Tokens extra: {sneaks} y {quick_seconds} (del quick accept).
    bedrock:
      enabled: true
      # Se usa cuando quick accept está activo para TPA (quick-accept.types.tpa).
      message:
        - '&6&l[&5&lMDVCRAFT&6&l]  &4»  &r&6{player} &equiere teletransportarse hacia ti.'
        - '&7Respóndela en &fSocial y Amigos &8» &fViajes (TPA)'
        - '&7o &eagáchate {sneaks} veces rápido &7en los próximos &e{quick_seconds}s &7para responder.'
      # Se usa cuando quick accept está desactivado.
      message-without-quick-accept:
        - '&6&l[&5&lMDVCRAFT&6&l]  &4»  &r&6{player} &equiere teletransportarse hacia ti.'
        - '&7Respóndela en &fSocial y Amigos &8» &fViajes (TPA) &7o con &f/tpa aceptar&7.'
      # Si quien la envía es tu amigo, el quick accept acepta directamente sin pedir confirmación.
      skip-confirmation-for-friends: true

  # /tpa ayuda
  help:
    - "&6&lTPA &7comandos:"
    - "&e/tpa <jugador> &7- Solicita teletransportarte."
    - "&e/tpa aceptar &7- Acepta la solicitud más reciente."
    - "&e/tpa rechazar &7- Rechaza la solicitud más reciente."
    - "&e/tpa cancelar &7- Cancela tu solicitud enviada."

  # Mensajes. Tokens entre llaves ({player}); también se acepta el formato antiguo %player%.
  # Un mensaje vacío ('') no se envía.
  messages:
    disabled: "&cEl sistema de TPA está desactivado."
    only-players: "&cEste comando solo puede usarlo un jugador."
    no-permission: "&cNo tienes permiso para usar el TPA."
    player-not-found: "&cJugador no encontrado o desconectado."
    cannot-self: "&cNo puedes enviarte una solicitud a ti mismo."
    cross-world-disabled: "&cNo puedes usar TPA entre mundos distintos."
    request-sent: "&eSolicitud de teletransporte enviada a &6{target}&e. &7Expira en &f{seconds} segundos&7."
    # Si el destinatario te bloqueó. No revela el bloqueo.
    request-not-delivered: "&cNo se pudo enviar la solicitud de teletransporte a &f{target}&c."
    request-expired: "&cLa solicitud de teletransporte ha expirado."
    request-expired-target: "&7La solicitud de &f{player} &7ha expirado."
    request-denied: "&cSolicitud de teletransporte rechazada."
    request-denied-target: "&eRechazaste la solicitud de &f{player}&e."
    request-accepted: "&aTeletransporte completado."
    request-accepted-target: "&aAceptaste la solicitud de &f{player}&a."
    request-cancelled: "&eCancelaste tu solicitud de teletransporte."
    # Aceptadas solas por ser del mismo grupo (tpa.party-auto-accept).
    party-auto-accepted: "&a{target} es de tu grupo: tu solicitud se aceptó automáticamente."
    party-auto-accepted-target: "&a{player} es de tu grupo: su solicitud de teletransporte se aceptó automáticamente."
    request-cancelled-target: "&7{player} canceló su solicitud de teletransporte."
    request-cancelled-disconnect: "&7La solicitud fue cancelada porque el jugador se desconectó."
    target-disconnected: "&cEl jugador objetivo se desconectó."
    requester-offline: "&cEl jugador que envió la solicitud ya no está conectado."
    no-pending-request: "&cNo tienes solicitudes de teletransporte pendientes."
    request-not-valid: "&cEsa solicitud ya no es válida o ha expirado."
    no-outgoing-request: "&cNo tienes una solicitud enviada pendiente."
    cooldown: "&cDebes esperar &f{seconds}s &cantes de enviar otra solicitud."
    teleport-failed: "&cNo se pudo completar el teletransporte."
    warmup-started: "&eTeletransporte aceptado. Tienes &f{grace_seconds}s &epara detenerte; después no te muevas durante &f{movement_lock_seconds}s&e. Entrar en combate cancela la espera."
    warmup-started-target: "&7{player} se teletransportará hacia ti en &f{seconds} segundos&7."
    warmup-cancelled-move: "&cEl teletransporte fue cancelado porque te moviste."
    warmup-cancelled-damage: "&cEl teletransporte fue cancelado porque recibiste daño."
    warmup-cancelled-attack: "&cEl teletransporte fue cancelado porque atacaste."
    warmup-cancelled-target: "&7El teletransporte de &f{player} &7fue cancelado."
    invulnerable: "&aTienes protección temporal durante &f{seconds}s&a."
    invulnerability-ended-on-attack: "&cTu protección temporal terminó al atacar."

# /grupo [jugador...]: crea un Grupo de Aventura e invita hasta 5 jugadores.
party-command:
  # Menú que se abre en Java tras /grupo sin nombres. Vacío = no abrir nada.
  # En Bedrock siempre se abre el formulario nativo del grupo.
  java-menu-command: 'party'

interactive-chat:
  enabled: true
  options-menu: jugador_opciones
  profile-cache-refresh-ticks: 100

  profile:
    level-placeholder: '%mmocore_level%'
    race-placeholders:
      - '%mmocore_race%'
      - '%mmocore_class%'
    clan-placeholder: '%mdvclans_clan_line_of_{name}%'

    # Grupo DIRECTO con mayor peso de LuckPerms.
    highest-weight-group-placeholders:
      - '%luckperms_highest_group_by_weight%'

    # Solo se usan si el placeholder de mayor peso no está disponible.
    primary-group-placeholders:
      - '%luckperms_primary_group_name%'
      - '%luckperms_primary_group%'

    # Nombres/colores opcionales para grupos que no están definidos en ranks:.
    # Las claves deben coincidir con el ID real del grupo de LuckPerms.
    group-display-names:
      admin: '&c&lAdministrador'
      moderador: '&5&lModerador'
      pomberito: '&2&lPombero'
      helper: '&b&lHelper'
      tester: '&eTester'

    # Último fallback si PlaceholderAPI/LuckPerms no responde.
    rank-priority-fallback:
      - heroe
      - noble
      - campeon
      - caballero
      - creador
      - embajador
      - aventurero
    no-title-text: '&7Sin título'
    no-rank-text: '&7Sin rango'
    no-clan-text: '&8Sin clan'

  hover:
    - '&6&l{player}'
    - ''
    - '&e&l● &7&lInformación'
    - '&7Nivel: &e{level}'
    - '&7Raza: &f{race}'
    - '&7Rango: &r{rank}'
    - '&7Título: &r{title}'
    - '&7Clan: &r{clan}'
    - ''
    - '&aClic para mirar opciones'
    - '&bShift + clic para escribirle'


# ==========================================================
# Opciones de amigos externos MMOCore
# Permite abrir un menú MDVSocial al hacer click izquierdo
# sobre un amigo en la lista de /friends.
# El click derecho queda libre para que MMOCore elimine amigos.
#
# target-menu debe existir en plugins/MDVSocial/Menus/<target-menu>.yml
# Placeholders disponibles:
# {target}, {target_name}, {target_uuid}, {target_status}, {target_online}
#
# party.when-no-party:
# - message: solo avisa que debes crear party primero
# - create-and-invite: crea party automáticamente y luego invita
# ==========================================================
social-friend-options:
  enabled: true
  title: 'Lista de Amigos'
  title-contains: ''
  click: LEFT
  cancel-event: true
  target-menu: amigo_opciones
  slots: [10,11,12,13,14,15,16,19,20,21,22,23,24,25,28,29,30,31,32,33,34]
  party:
    when-no-party: create-and-invite
    max-members: 5  
  sound: open  
# ==========================================================
# Jugadores bloqueados (general, no solo cartas)
# Comandos: /bloquear <jugador>, /desbloquear <jugador>, /bloqueados
# Impide: recibir cartas, invitaciones de clan por carta e invitaciones a grupos.
# API: MDVSocialAPI.isBlocked(dueño, objetivo)
# ==========================================================
blocked-players:
  # Máximo de jugadores que cada uno puede bloquear (0 = sin límite).
  max-entries: 200
  # Comandos de invitación de MMOCore que también respetan los bloqueos si el
  # jugador los escribe a mano (las invitaciones de MDVSocial ya se revisan).
  party-invite-commands:
    - 'party invite'
    - 'mmocore:party invite'
  # Textos del menú Java. Bedrock usa MenusBedrock/bloqueados.yml.
  menu:
    title: '&8&lJugadores Bloqueados &7({count})'
    entry:
      name: '&f{target}'
      lore:
        - ''
        - '&7No puede enviarte cartas.'
        - ''
        - '&eClick para desbloquear.'
    empty:
      name: '&7No tienes jugadores bloqueados'
      lore:
        - ''
        - '&7Los jugadores bloqueados'
        - '&7no pueden enviarte cartas.'
    block:
      name: '&c&lBloquear jugador'
      lore:
        - ''
        - '&7Escribe el nombre del jugador'
        - '&7que quieres bloquear.'
        - ''
        - '&eClick para comenzar.'
    back: '&6&lVolver'
    back-lore:
      - '&7Regresa al menú de amigos.'
    previous: '&ePágina anterior'
    next: '&ePágina siguiente'

mail:
  enabled: true

  # Las cartas se borran para siempre después de X días.
  expire-after-days: 10

  # Cada cuánto limpia cartas expiradas.
  cleanup-interval-minutes: 120

  # Tamaño base del buzón.
  default-mailbox-size: 10

  # Límite máximo de caracteres por carta.
  max-message-length: 180

  # Segundos de espera entre cartas de un mismo jugador (0 = sin espera).
  # Permiso para saltarla: mdvsocial.mail.cooldown.bypass
  send-cooldown-seconds: 30

  # Si está false, solo se puede mandar carta a jugadores que ya entraron al servidor.
  allow-unknown-targets: false
  # Cantidad de nombres sugeridos cuando se escribe mal un jugador.
  name-suggestions-limit: 5

  # Cartas enviadas por consola/admin a todos.
  server-author-name: 'MDVCRAFT'
  server-mail-expire-days: 30
  server-mail-ignore-mailbox-limit: true

  # Carta entregada automaticamente a jugadores nuevos.
  # Cambia el id cuando quieras crear una nueva bienvenida para futuros jugadores.
  welcome:
    enabled: true
    id: 'bienvenida-v1'
    only-first-join: true
    author-name: 'MDVCRAFT'
    message: '¡Bienvenido a MDVCRAFT! Revisa el libro del viajero para conocer tus hogares, títulos, correo, amigos y demás sistemas.'
    expire-days: 3
    ignore-mailbox-limit: true

    # false: la bienvenida llega solo al buzón, sin avisos en el chat.
    notify-in-chat: false
  never-expires-text: 'no expira'
  # Permisos para expandir buzón. Si el destinatario está desconectado se usa
  # el último límite que tuvo conectado (se actualiza al entrar al servidor).
  mailbox-size-permissions:
    mdvsocial.mailbox.15: 15
    mdvsocial.mailbox.25: 25
    mdvsocial.mailbox.35: 35
    mdvsocial.mailbox.50: 50
    
  clan-invites:
    ignore-mailbox-limit: true
    # Las invitaciones de clan por carta tampoco llegan si el invitado bloqueó a quien invita.
    
    
  # Formato de fecha visible en las cartas.
  date-format: 'dd/MM HH:mm'

  menus:
    mailbox:
      title: '&8&lBuzon &7{count}/{limit}'
      size: 54
      slots:
        - 10
        - 11
        - 12
        - 13
        - 14
        - 15
        - 16
        - 19
        - 20
        - 21
        - 22
        - 23
        - 24
        - 25
        - 28
        - 29
        - 30
        - 31
        - 32
        - 33
        - 34
        - 37
        - 38
        - 39
        - 40
        - 41
        - 42
        - 43

    read:
      title: '&8Carta de {sender}'
      size: 27
      back-slot: 10
      letter-slot: 13
      reply-slot: 11
      delete-slot: 15
      block-slot: 16

  items:
    empty:
      name: '&7Buzon vacio'
      lore:
        - '&8No tienes cartas guardadas.'
        
    clan-invite-accept:
      material: LIME_DYE
      name: '&a&lAceptar invitación'
      lore:
        - ''
        - '&7Acepta la invitación al clan.'
        - '&8Solo podrás entrar si hay cupo'
        - '&8y la invitación sigue vigente.'
        - ''
        - '&eClick para aceptar.'

    clan-invite-reject:
      material: RED_DYE
      name: '&c&lRechazar invitación'
      lore:
        - ''
        - '&7Rechaza la invitación al clan.'
        - '&8La carta será eliminada.'
        - ''
        - '&eClick para rechazar.'
        
    delete:
      material: RED_DYE
      name: '&c&lEliminar carta'
      lore:
        - '&7Elimina esta carta de tu buzon.'
        - '&8Esta accion no se puede deshacer.'

    block-sender:
      material: BARRIER
      name: '&c&lBloquear remitente'
      lore:
        - '&7Bloquea a este jugador para que'
        - '&7no pueda enviarte mas cartas.'
        
    reply:
      material: WRITABLE_BOOK
      name: '&e&lResponder carta'
      lore:
        - '&7Responde directamente al jugador'
        - '&7que te envio esta carta.'
        - '&8Se cerrara el menu y escribiras en chat.'        
        
        
# ==========================================================
# Puente para GUIs externas
