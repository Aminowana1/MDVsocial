type: "SIMPLE"
title: "&8&lAdministración de MDVCRAFT"
permission: "mdvsocial.admin-menu"
content:
  - "&7Selecciona una opción."
buttons:
  misiones:
    text: "&6&lMisiones\n&r&8Crea, modifica y prueba misiones"
    action: "COMMAND_PLAYER"
    commands:
      - "mdvquest admin"
    permission: "mdvquest.editor"
    hide-without-permission: true
  recetas:
    text: "&6&lCrear recetas\n&r&8Abre exclusivamente el creador"
    action: "COMMAND_PLAYER"
    commands:
      - "mdvrecetas editor"
    permission: "mdvrecetas.editor"
    hide-without-permission: true
  objetos:
    text: "&6&lBiblioteca de MMOItems\n&r&8Explora todos los MMOItems"
    action: "OPEN_MMOITEMS_BROWSER"
    permission: "mdvsocial.item-browser"
    hide-without-permission: true
  creativo:
    text: "&2&lModo creativo\n&r&8Cambia tu modo de juego"
    action: "COMMAND_PLAYER"
    commands:
      - "gmc"
    permission: "essentials.gamemode.creative"
    hide-without-permission: true
  staff:
    text: "&3&lModo Staff\n&r&8Activa o desactiva las herramientas"
    action: "COMMAND_PLAYER"
    commands:
      - "staff"
    close-on-click: true
    permission: "mdvsocial.admin-menu"
    hide-without-permission: true
  volver:
    text: "&6&lVolver al menú social\n&r&8Regresa al menú principal."
    action: "COMMAND_PLAYER"
    commands:
      - "social"
