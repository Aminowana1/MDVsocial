type: "SIMPLE"
title: "&8&lCartas y Buzón"
content:
  - "&7Lee tus cartas o envía una nueva."
buttons:
  buzon:
    text: "&6&lVer Cartas ({unread_mail})\n&r&8Revisa las cartas que"
    action: "OPEN_MAILBOX"
  enviar:
    text: "&6&lEnviar Carta\n&r&8Escribe una carta a otro"
    action: "START_MAIL_SEND"
    close-on-click: true
  volver:
    text: "&6&lVolver\n&r&8Regresa a Social y Amigos."
    action: "OPEN_MENU"
    target-menu: "menuamigos"
# "Escoger jugador" al pulsar "Enviar Carta". "Escribir nombre" permite escribir
# a jugadores desconectados.
recipient-picker:
  title: "&6&lEnviar carta &8({page}/{max_page})"
  content: "&7Elige a quién escribir o escribe su nombre."
