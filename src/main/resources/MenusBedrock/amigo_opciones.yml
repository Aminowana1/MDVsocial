type: "SIMPLE"
title: "&8&lOpciones de {target}"
content:
  - "&7Opciones disponibles para &f{target}&7."
buttons:
  perfil:
    text: "&6&lPerfil de {target}\n&r&8Estado: {target_status}"
  clan_invite:
    text: "&5&lInvitar al clan\n&r&8Envía una invitación a {target}."
    action: "COMMAND_PLAYER"
    commands:
      - "clan invitar {target}"
    close-on-click: true
  carta:
    text: "&6&lEnviar carta\n&r&8Escribe una carta para {target}."
    action: "START_MAIL_SEND_TARGET"
    close-on-click: true
  party:
    text: "&5&lInvitar al grupo\n&r&8Invita a &6{target} &8a tu grupo."
    action: "INVITE_PARTY_TARGET"
    close-on-click: true
    visible-when: "online"
  eliminar_amigo:
    text: "&4&lEliminar amigo\n&r&8Quita a &0{target} &8de tu lista."
    action: "REMOVE_FRIEND_TARGET"
  offline_info:
    text: "&8&lCompañero desconectado\n&r&8Este jugador no está conectado."
    visible-when: "offline"
  tpa:
    text: "&2&lSolicitar viaje\n&r&8Envía una solicitud de TPA."
    action: "COMMAND_PLAYER"
    commands:
      - "tpa {target}"
    visible-when: "online"
  volver:
    text: "&6&lVolver\n&r&8Regresa a la lista de amigos."
    action: "OPEN_BEDROCK_FRIENDS"
    commands:
      - "friends"

remove-friend-confirm:
  title: "&c&lEliminar a {target}"
  content: "&7¿Seguro que quieres eliminar a &f{target} &7de tus amigos?"
  confirm:
    text: "&4&lSí, eliminar amigo"
    image:
      type: "URL"
      data: ""
  back:
    text: "&6&lVolver"
    image:
      type: "URL"
      data: ""
