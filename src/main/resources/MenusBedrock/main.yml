type: "SIMPLE"
title: "&8&lMDVSocial"
content:
  - "&7Menú social de MDVCRAFT."
  - "&8La interfaz se adapta automáticamente a Bedrock."
buttons:
  protecciones:
    text: "&aTus protecciones\n&7Coordenadas y miembros"
    action: COMMAND_PLAYER
    commands:
      - 'mdvsocial:protes'
    permission: mdvsocial.protections.use
  perfil:
    text: "&e&lTu Personaje\n&7Nivel: &e{level}"
    action: "OPEN_MENU"
    target-menu: "menuperfil"
  homes:
    text: "&6&lTus Hogares\n&7Revisa, crea, elimina"
    action: "COMMAND_PLAYER"
    commands:
      - "mdvsocial:casa"
  misiones:
    text: "&6&lContratos\n&7Consulta las misiones disponibles,"
    action: "COMMAND_PLAYER"
    commands:
      - "mdvquest"
    close-on-click: true
    sound: "open"
  clan:
    text: "&5&lClan\n&7Accede a miembros, bases,"
    action: "OPEN_CONDITIONAL_MENU"
    condition-placeholder: "%mdvclans_is_in_clan%"
    condition-equals: "true"
    true-menu: "clan_con_clan"
    false-menu: "clan_sin_clan"
  amigos:
    text: "&a&lAmigos\n&7Revisa contactos, cartas"
    action: "OPEN_MENU"
    target-menu: "menuamigos"
  recetas:
    text: "&a&lRecetas\n&7Consulta materiales, armas,"
    action: "COMMAND_PLAYER"
    commands:
      - "mdvrecetas"
    close-on-click: true
  kits:
    text: "&b&lSuministros\n&7Reclama equipo básico"
    action: "COMMAND_PLAYER"
    commands:
      - "suministros"
    close-on-click: true
  titulos:
    text: "&6&lTítulos y Rangos\n&7Compra, equipa y revisa"
    action: "OPEN_TITLES"
  administracion:
    text: "&c&lAdministración\n&7Herramientas para administrar"
    action: "OPEN_MENU"
    target-menu: "admin"
    sound: "open"
    permission: "mdvsocial.admin-menu"
    hide-without-permission: true
  warps:
    text: "&b&lLugares del Mundo\n&7Abre el mapa de lugares"
    action: "OPEN_MENU"
    target-menu: "warps"
  ayuda:
    text: "&d&lAyuda\n&7Consulta comandos útiles"
    action: "OPEN_MENU"
    target-menu: "ayuda"
