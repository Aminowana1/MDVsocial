# ==========================================================
# MDVSocial - Menu modular principal
# Acciones disponibles: OPEN_MENU / OPEN_CONDITIONAL_MENU / MDVCLANS_OPEN / COMMAND_PLAYER / BACK / CLOSE
# ==========================================================
title: '&8MDVSocial'
size: 27
items:
  protecciones:
    slot: 22
    material: EMERALD_BLOCK
    name: '&aTus protecciones'
    lore:
      - '&7Coordenadas, miembros y eliminacion remota.'
      - '&eClick para gestionar.'
    action: COMMAND_PLAYER
    commands:
      - 'mdvsocial:protes'
    permission: mdvsocial.protections.use
  titulos:
    slot: 11
    material: NAME_TAG
    name: '&eTitulos y rangos'
    lore:
      - '&7Compra, equipa o revisa titulos.'
      - '&eClick para abrir.'
    action: OPEN_TITLES
    sound: open

  clan:
    slot: 13
    material: GREEN_BANNER
    use-clan-banner: true
    name: '&aClan'
    lore:
      - '&7Abre el menu de clan.'
      - '&8Si tienes clan, muestra su banner.'
      - '&eClick para abrir.'
    action: OPEN_CONDITIONAL_MENU
    sound: open
    condition-placeholder: '%mdvclans_is_in_clan%'
    condition-equals: 'true'
    true-menu: clan_con_clan
    false-menu: clan_sin_clan

  ayuda:
    slot: 15
    material: BOOK
    name: '&bAyuda social'
    lore:
      - '&7Comandos sociales utiles.'
      - '&eClick para abrir.'
    action: OPEN_MENU
    sound: open
    target-menu: ayuda

  cerrar:
    slot: 26
    material: BARRIER
    name: '&cCerrar'
    action: CLOSE
    sound: close
